<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Kyro Outreach</title>
<style>
:root{--bg:#f7f7f5;--surface:#fff;--ink:#141414;--muted:#777771;--faint:#a5a59e;--line:#e6e6e1;--line2:#d8d8d1;--soft:#f1f1ed;--accent:#69739e;--accentSoft:#eef0f8;--max:1320px;--radius:9px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:20px 12px 14px;display:flex;flex-direction:column;background:#fbfbfa}.logo{font-size:21px;font-weight:780;letter-spacing:-.065em;padding:3px 10px 23px}.workspace{margin:0 3px 21px;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:#fff}.workspace .label{display:block}.workspace strong{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-top:4px}.workspace strong:after{content:"";width:6px;height:6px;border-radius:50%;background:#5e9a70}.label{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--muted)}nav{display:grid;gap:1px}.nav{border:0;border-radius:6px;background:transparent;color:#696963;text-align:left;padding:9px 10px;font-size:12px;font-weight:520;transition:background .18s,color .18s}.nav:hover{background:var(--soft);color:var(--ink)}.nav.active{background:#191919;color:#fff}.sidebarFoot{margin-top:auto;border-top:1px solid var(--line);padding:13px 10px;color:var(--faint);font-size:9px;line-height:1.65}.main{min-width:0}.topbar{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10;background:rgba(250,250,249,.94);backdrop-filter:blur(12px)}.topbarTitle{font-size:12px;font-weight:650}.topbarActions{display:flex;align-items:center;gap:9px}.status{font-size:10px;color:var(--muted);padding-right:8px}.mobileMenu{display:none;border:0;background:transparent;font-size:19px;color:var(--ink)}
.content{width:min(100%,var(--max));margin:auto;padding:44px 38px 90px}.viewHead{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:30px}.viewHead h1{font-size:46px;line-height:1;letter-spacing:-.065em;margin:7px 0 11px;font-weight:720}.viewHead p{margin:0;color:var(--muted);max-width:590px;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--ink);padding:9px 13px;font-size:11px;font-weight:650;transition:background .18s,border-color .18s,transform .18s}.btn:hover{background:var(--soft);border-color:#c9c9c2;transform:translateY(-1px)}.btn.primary{background:#171717;border-color:#171717;color:#fff}.btn.primary:hover{background:#2a2a2a}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.grid{display:grid;gap:12px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);overflow:hidden;transition:border-color .2s,box-shadow .2s,transform .2s}.card:hover{border-color:#d6d6cf}.cardHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.cardHead h2{font-size:12px;margin:0;font-weight:680}.cardBody{padding:17px}.metric{padding:17px 18px;min-height:128px;position:relative}.metric:after{content:"";position:absolute;right:18px;top:18px;width:5px;height:5px;border-radius:50%;background:#d0d0ca}.metric strong{display:block;font-size:34px;line-height:1;letter-spacing:-.065em;margin-top:12px;font-weight:700}.metric p{font-size:10px;color:var(--muted);margin:7px 0 0}.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,.55fr);gap:35px;background:#171717;color:#fff;border-radius:var(--radius);padding:37px 38px;margin-bottom:12px;min-height:292px;animation:rise .45s ease both}.hero h2{font-size:53px;line-height:.97;letter-spacing:-.07em;max-width:760px;margin:11px 0 15px;font-weight:720}.hero p{color:#bdbdb8;max-width:650px;margin:0 0 24px;font-size:13px}.hero .btn{background:#fff;border-color:#fff;color:#111;padding:10px 15px}.heroSide{border-left:1px solid #353535;padding-left:25px;display:flex;flex-direction:column;justify-content:center;color:#969691;font-size:10px}.heroSide strong{font-size:57px;line-height:1;color:#fff;letter-spacing:-.07em;margin:8px 0}.listRow{padding:13px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.listRow:last-child{border-bottom:0}.muted{color:var(--muted)}.small{font-size:10px}.pill{display:inline-flex;align-items:center;padding:4px 7px;background:var(--soft);border:1px solid var(--line);border-radius:999px;font-size:9px;color:var(--muted);white-space:nowrap}.pill.accent{background:var(--accentSoft);border-color:#d7dbea;color:#58628d}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;padding:10px 14px;background:#fbfbfa;border-bottom:1px solid var(--line);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.table td{padding:14px;border-bottom:1px solid var(--line);font-size:11px}.table tbody tr{transition:background .15s}.table tbody tr:hover{background:#fafaf8}.notice{border:1px solid #dedbd0;background:#fbfaf5;color:#6d695f;padding:11px 13px;font-size:10px;margin-bottom:12px;border-radius:7px}.empty{text-align:center;padding:54px 18px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px;font-size:12px}.auth{min-height:100vh;display:grid;place-items:center;background:var(--soft);padding:22px}.authCard{width:min(460px,100%);background:#fff;border:1px solid var(--line);padding:31px}.authCard h1{font-size:36px;letter-spacing:-.055em;margin:5px 0 8px}.authCard p{color:var(--muted);margin:0 0 25px}.authActions{display:grid;gap:9px}.authActions .btn{width:100%;padding:12px}.divider{height:1px;background:var(--line);margin:22px 0}.field{width:100%;border:1px solid var(--line2);border-radius:6px;padding:10px 11px;background:#fff;color:var(--ink)}.field:disabled{background:var(--soft);color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.viewHead,.card{animation:rise .32s ease both}
@media(max-width:1000px){.content{padding:35px 24px 70px}.hero{grid-template-columns:1fr}.heroSide{border-left:0;border-top:1px solid #353535;padding:19px 0 0;display:block}.heroSide strong{font-size:45px}.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:12px 0 35px rgba(0,0,0,.08)}.sidebar.open{transform:translateX(0)}.mobileMenu{display:block}.topbar{padding:0 16px}.content{padding:28px 16px 55px}.viewHead{display:block}.viewHead h1{font-size:38px}.viewHead .actions{margin-top:17px;justify-content:flex-start}.two,.three{grid-template-columns:1fr}.hero{padding:27px 24px;min-height:auto}.hero h2{font-size:40px}.four{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.four{grid-template-columns:1fr}.viewHead h1{font-size:34px}.hero h2{font-size:34px}.hero{padding:23px 20px}.topbarActions .btn{padding:8px 10px}.status{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div id="root"></div>
<script>
var state={view:"overview",mobile:false,prospects:[],campaigns:[],activity:[]};
var demo={
prospects:[
{id:1,name:"Amani Media",company:"Amani Media",email:"hello@amani.example",status:"New",campaign:"Unassigned"},
{id:2,name:"Nova Brand",company:"Nova Brand",email:"team@nova.example",status:"Draft",campaign:"Launch Q4"},
{id:3,name:"Kipepeo Co.",company:"Kipepeo Co.",email:"hello@kipepeo.example",status:"Approved",campaign:"Creator push"},
{id:4,name:"Studio Tamu",company:"Studio Tamu",email:"studio@tamu.example",status:"Replied",campaign:"Partnership"}],
campaigns:[
{id:1,name:"Launch Q4",status:"Active",channel:"Email",goal:"Reach qualified creative teams"},
{id:2,name:"Creator push",status:"Draft",channel:"Email",goal:"Build creator partnerships"},
{id:3,name:"Partnership",status:"Paused",channel:"Email",goal:"Start strategic conversations"}],
activity:[
{id:1,kind:"Approval",message:"Kipepeo Co. draft approved",created_at:"Today"},
{id:2,kind:"Reply",message:"Studio Tamu replied",created_at:"Today"},
{id:3,kind:"Campaign",message:"Launch Q4 is active",created_at:"Today"}]};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function clone(v){return JSON.parse(JSON.stringify(v))}
function startDemo(){state.prospects=[];state.campaigns=[];state.activity=[];render()}
function startOwner(){state.mode="owner";state.prospects=[];state.campaigns=[];state.activity=[];render()}
function setView(v){state.view=v;state.mobile=false;render()}
function counts(){return{p:state.prospects.length,a:state.prospects.filter(function(x){return x.status==="Approved"}).length,r:state.prospects.filter(function(x){return x.status==="Replied"||x.status==="Interested"}).length,c:state.campaigns.filter(function(x){return x.status==="Active"}).length}}
function auth(){document.getElementById("root").innerHTML='<main class="auth"><section class="authCard"><span class="label">Kcreatives</span><h1>Kyro Outreach</h1><p>Approval-first outreach workspace for managing prospects, campaigns, drafts and accountable sending.</p><div class="authActions"></div><div class="divider"></div><span class="small muted"> uses fictional .example addresses. Demo sends are simulated and cannot deliver email.</span></section></main>'}
function nav(){var items=[["overview","Overview"],["prospects","Prospects"],["campaigns","Campaigns"],["approvals","Approvals"],["activity","Activity"],["settings","Settings"]];return items.map(function(x){return '<button class="nav '+(state.view===x[0]?"active":"")+'" onclick="setView(\''+x[0]+'\')">'+x[1]+"</button>"}).join("")}
function shell(){document.getElementById("root").innerHTML='<div class="shell"><aside class="sidebar '+(state.mobile?"open":"")+'"><div class="logo">Kyro</div><div class="label" style="padding:0 10px 8px">Workspace</div><div class="workspace"><span class="label">Workspace</span><strong>'+(state.mode==="demo"?"Demo workspace":"Owner workspace")+'</strong></div><nav>'+nav()+'</nav><div class="sidebarFoot">'+(state.mode==="demo"?" · sends simulated":"Private workspace")+'<br>Approval required before outreach.</div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobileMenu" onclick="state.mobile=!state.mobile;render()">☰</button><span class="topbarTitle">Kyro Outreach</span></div><div class="topbarActions"><span class="status">'+(state.mode==="demo"?"Demo environment":"Owner workspace")+'</span><button class="btn" onclick="setView(\'settings\')">Settings</button></div></header><div class="content" id="content"></div></main></div>';renderView()}
function head(title,desc,actions){return '<div class="viewHead"><div><span class="label">Kyro Outreach</span><h1>'+title+'</h1><p>'+desc+'</p></div><div class="actions">'+(actions||"")+"</div></div>"}
function metric(label,value,desc){return '<div class="card metric"><span class="label">'+label+'</span><strong>'+value+'</strong><p>'+desc+"</p></div>"}
function activityList(limit){var arr=state.activity.slice(0,limit||50);if(!arr.length)return '<div class="empty"><strong>No activity yet.</strong>Workspace events will appear here.</div>';return arr.map(function(x){return '<div class="listRow"><div><strong style="font-size:12px">'+esc(x.kind)+'</strong><div class="small muted">'+esc(x.message)+'</div></div><span class="small muted">'+esc(x.created_at)+'</span></div>'}).join("")}
function overview(){var c=counts();return head("Outreach, under control.","Build your prospect list, define campaigns, prepare drafts and approve every message before anything is scheduled or sent.",'<button class="btn primary" onclick="setView(\'prospects\')">Add prospect</button><button class="btn" onclick="setView(\'campaigns\')">New campaign</button>')+'<section class="hero"><div><span class="label" style="color:#aaa">Approval-first workflow</span><h2>Nothing sends until you approve it.</h2><p>Kyro keeps research, drafts, approvals and sending separate so outreach stays deliberate and traceable.</p><button class="btn" onclick="setView(\'approvals\')">Review approvals</button></div><div class="heroSide"><span>Daily workspace ceiling</span><strong>10</strong><span>successful outreach messages</span></div></section><section class="grid four" style="margin-bottom:14px">'+metric("Prospects",c.p,"people in workspace")+metric("Approved",c.a,"ready for eligible sending")+metric("Replies",c.r,"replied or interested")+metric("Active campaigns",c.c,"currently active")+'</section><div style="display:flex;align-items:center;gap:10px;margin:24px 0 10px"><span class="label">Workspace pulse</span><span style="height:1px;background:var(--line);flex:1"></span></div><section class="grid two"><div class="card"><div class="cardHead"><h2>Recent activity</h2><button class="btn" onclick="setView(\'activity\')">View all</button></div><div class="cardBody">'+activityList(4)+'</div></div><div class="card"><div class="cardHead"><h2>Workspace rules</h2></div><div class="cardBody">'+rule("Approval","Required before scheduling or sending.")+rule("Suppression","Do-not-contact records stop outreach.")+rule("Quota","Successful outreach is capped at 10/day.")+rule("Analytics","Only recorded Kyro events are counted.")+"</div></div></section>"}
function rule(a,b){return '<div class="listRow"><strong style="font-size:12px">'+a+'</strong><span class="small muted">'+b+"</span></div>"}
function prospects(){var rows=state.prospects.map(function(p){return '<tr><td><strong>'+esc(p.name)+'</strong><div class="small muted">'+esc(p.company)+'</div></td><td>'+esc(p.email)+'</td><td><span class="pill '+(p.status==="Approved"?"accent":"")+'">'+esc(p.status)+'</span></td><td>'+esc(p.campaign||"Unassigned")+"</td></tr>"}).join("");if(!rows)rows='<tr><td colspan="4"><div class="empty"><strong>No prospects yet.</strong>Add your first prospect to begin.</div></td></tr>';return head("Prospects","Your working list of people and companies. Keep qualification, status and campaign context close at hand.",'<button class="btn primary" onclick="addProspect()">Add prospect</button>')+'<div class="notice">Adding a prospect does not create permission to send. Drafts must be explicitly approved.</div><div class="card"><div class="cardHead"><h2>Prospect database</h2><span class="small muted">'+state.prospects.length+" records</span></div><div class=\"tableWrap\"><table class=\"table\"><thead><tr><th>Prospect</th><th>Email</th><th>Status</th><th>Campaign</th></tr></thead><tbody>"+rows+"</tbody></table></div></div>"}
function campaigns(){var cards=state.campaigns.map(function(c){return '<article class="card"><div class="cardHead"><h2>'+esc(c.name)+'</h2><span class="pill '+(c.status==="Active"?"accent":"")+'">'+esc(c.status)+'</span></div><div class="cardBody"><span class="label">Goal</span><p style="margin:6px 0 18px">'+esc(c.goal||"No goal defined.")+'</p><span class="small muted">Channel · '+esc(c.channel)+'</span></div></article>'}).join("");if(!cards)cards='<div class="card empty"><strong>No campaigns yet.</strong>Create one when the prospect foundation is ready.</div>';return head("Campaigns","Turn approved prospects into focused outreach programs with clear goals and controlled activation.",'<button class="btn primary" onclick="addCampaign()">New campaign</button>')+'<div class="grid two">'+cards+"</div>"}
function approvals(){var drafts=state.prospects.filter(function(p){return p.status==="Draft"});var cards=drafts.map(function(p){return '<article class="card"><div class="cardHead"><h2>'+esc(p.company)+'</h2><span class="pill">Draft</span></div><div class="cardBody"><span class="small muted">Contact</span><p>'+esc(p.name)+' · '+esc(p.email)+'</p><button class="btn accent" onclick="approve('+p.id+')">Approve draft</button></div></article>'}).join("");if(!cards)cards='<div class="card empty"><strong>Nothing waiting for approval.</strong>Approved records stay out of this queue.</div>';return head("Approvals","Review the messages that are waiting for your decision. Nothing crosses the line without approval.",'<button class="btn" onclick="setView(\'prospects\')">View prospects</button>')+'<div class="notice">AI-generated drafts are not automatically sent. Approval is a deliberate action.</div><div class="grid two">'+cards+"</div>"}
function activity(){return head("Activity","A readable audit trail of workspace events.",'<button class="btn" onclick="render()">Refresh</button>')+'<div class="card"><div class="cardBody">'+activityList()+"</div></div>"}
function settings(){return head("Settings","Workspace configuration and delivery readiness.",'<button class="btn" onclick="render()">Save changes</button>')+'<div class="grid two"><div class="card"><div class="cardHead"><h2>Delivery</h2></div><div class="cardBody"><label class=\"label\">Sender email</label><input class=\"field\" placeholder=\"Configured server-side\" disabled></div></div><div class=\"card\"><div class=\"cardHead\"><h2>Security</h2></div><div class=\"cardBody\">"+rule("Sessions","Random server-side sessions with secure cookies.")+rule("CSRF","Mutating requests require a session-bound token.")+rule("Secrets","Provider credentials stay server-side.")+rule("Scheduler","Cron endpoint requires a bearer secret.")+"</div></div></div>"}
function addProspect(){var name=prompt("Prospect name");if(!name)return;var company=prompt("Company",name);if(!company)return;var email=prompt("Email","contact@example.com")||"contact@example.com";state.prospects.unshift({id:Date.now(),name:name,company:company,email:email,status:"New",campaign:"Unassigned"});state.activity.unshift({id:Date.now(),kind:"Prospect added",message:name+" · "+company,created_at:"Just now"});renderView()}
function addCampaign(){var name=prompt("Campaign name");if(!name)return;state.campaigns.unshift({id:Date.now(),name:name,status:"Draft",channel:"Email",goal:""});state.activity.unshift({id:Date.now(),kind:"Campaign created",message:name,created_at:"Just now"});renderView()}
function approve(id){var p=state.prospects.find(function(x){return x.id===id});if(!p)return;p.status="Approved";state.activity.unshift({id:Date.now(),kind:"Approval",message:p.company+" draft approved",created_at:"Just now"});renderView()}
function renderView(){var el=document.getElementById("content");var map={overview:overview,prospects:prospects,campaigns:campaigns,approvals:approvals,activity:activity,settings:settings};el.innerHTML=map[state.view]();window.scrollTo(0,0)}
function render(){shell()}
render();
</script>
</body>
</html>
<style>
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.viewHead,.card{animation:enter .35s ease both}
.card{transition:border-color .2s,transform .2s}
.card:hover{border-color:#d8d8d1}
.table tr:hover td{background:#fafaf8}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media(max-width:900px){.content{padding:32px 20px 60px}.viewHead h1{font-size:38px}.hero{grid-template-columns:1fr;padding:27px}.hero h2{font-size:42px}}
@media(max-width:600px){.content{padding:26px 16px 50px}.viewHead h1{font-size:34px}.hero{padding:22px;border-radius:8px}.hero h2{font-size:35px}.btn{min-height:40px}}
</style>
