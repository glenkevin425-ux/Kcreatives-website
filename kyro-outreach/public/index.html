<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>Kyro Outreach</title>
<style>
:root{--bg:#f7f7f5;--surface:#fff;--ink:#171717;--muted:#74746e;--faint:#a4a49d;--line:#e4e4df;--soft:#f1f1ed;--accent:#68739f;--accent-soft:#eef0f7;--danger:#a34e4e;--max:1320px;--r:9px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:224px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#fbfbfa;padding:20px 12px 14px;display:flex;flex-direction:column;z-index:20}.brand{font-size:21px;font-weight:800;letter-spacing:-.065em;padding:3px 10px 24px}.workspace{border:1px solid var(--line);background:#fff;border-radius:7px;padding:11px;margin:0 3px 21px}.workspace .name{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650;margin-top:4px}.dot{width:6px;height:6px;border-radius:50%;background:#6a9975}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;font-weight:750;color:var(--muted)}.nav{display:grid;gap:2px}.nav button{border:0;border-radius:6px;background:transparent;color:#686862;text-align:left;padding:9px 10px;font-size:12px;transition:.18s}.nav button:hover{background:var(--soft);color:var(--ink)}.nav button.active{background:#191919;color:#fff}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:13px 10px;color:var(--faint);font-size:9px;line-height:1.65}
.main{min-width:0}.topbar{height:60px;border-bottom:1px solid var(--line);background:rgba(250,250,249,.95);backdrop-filter:blur(12px);position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 30px}.topbar-left,.topbar-right{display:flex;align-items:center;gap:10px}.top-title{font-size:12px;font-weight:650}.status{font-size:10px;color:var(--muted)}.menu{display:none;border:0;background:transparent;font-size:19px;padding:5px}.content{width:min(100%,var(--max));margin:auto;padding:44px 38px 90px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:25px;margin-bottom:30px}.head h1{font-size:46px;line-height:1;letter-spacing:-.065em;margin:7px 0 11px;font-weight:730}.head p{margin:0;max-width:610px;color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #d5d5ce;border-radius:6px;background:#fff;color:var(--ink);padding:9px 13px;font-size:11px;font-weight:650;transition:background .18s,border-color .18s,transform .18s}.btn:hover{background:var(--soft);border-color:#c5c5bd;transform:translateY(-1px)}.btn.primary{background:#171717;border-color:#171717;color:#fff}.btn.primary:hover{background:#292929}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.grid{display:grid;gap:12px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head h2{font-size:12px;margin:0;font-weight:700}.card-body{padding:17px}.metric{padding:17px 18px;min-height:128px}.metric strong{display:block;font-size:34px;line-height:1;letter-spacing:-.065em;margin-top:12px}.metric p{font-size:10px;color:var(--muted);margin:7px 0 0}.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(230px,.55fr);gap:34px;background:#171717;color:#fff;border-radius:var(--r);padding:38px;min-height:290px;margin-bottom:12px}.hero h2{font-size:53px;line-height:.97;letter-spacing:-.07em;max-width:760px;margin:11px 0 15px}.hero p{color:#bdbdb8;max-width:650px;margin:0 0 24px;font-size:13px}.hero .btn{background:#fff;border-color:#fff;color:#111}.hero-side{border-left:1px solid #363636;padding-left:25px;display:flex;flex-direction:column;justify-content:center;color:#989893;font-size:10px}.hero-side strong{font-size:57px;line-height:1;color:#fff;letter-spacing:-.07em;margin:8px 0}.rule{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.rule:last-child{border-bottom:0}.small{font-size:10px}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;padding:4px 7px;background:var(--soft);border:1px solid var(--line);border-radius:999px;font-size:9px;color:var(--muted);white-space:nowrap}.pill.accent{background:var(--accent-soft);border-color:#d7dbea;color:#58628d}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;padding:10px 14px;background:#fbfbfa;border-bottom:1px solid var(--line);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.table td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:11px}.table tr:hover td{background:#fafaf8}.empty{text-align:center;padding:52px 18px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:5px;font-size:12px}.notice{border:1px solid #dedbd0;background:#fbfaf5;color:#6d695f;padding:11px 13px;font-size:10px;margin-bottom:12px;border-radius:7px}.form{display:grid;gap:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-group{display:grid;gap:6px}.field-group.full{grid-column:1/-1}.field{width:100%;border:1px solid #d4d4cd;border-radius:6px;padding:10px 11px;background:#fff;color:var(--ink)}textarea.field{min-height:100px;resize:vertical}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 70px rgba(0,0,0,.15)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.modal-head h2{margin:0;font-size:17px;letter-spacing:-.03em}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.icon-btn{border:0;background:transparent;font-size:18px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:#171717;color:#fff;padding:11px 14px;border-radius:7px;font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.16)}.error{color:var(--danger);font-size:11px}.loading{padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:1000px){.content{padding:35px 24px 70px}.hero{grid-template-columns:1fr}.hero-side{border-left:0;border-top:1px solid #363636;padding:19px 0 0}.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-102%);transition:transform .2s;box-shadow:12px 0 35px rgba(0,0,0,.08)}.sidebar.open{transform:translateX(0)}.menu{display:block}.topbar{padding:0 16px}.content{padding:28px 16px 55px}.head{display:block}.head h1{font-size:38px}.actions{justify-content:flex-start;margin-top:17px}.two{grid-template-columns:1fr}.hero{padding:27px 24px}.hero h2{font-size:40px}.form-grid{grid-template-columns:1fr}.field-group.full{grid-column:auto}}
@media(max-width:480px){.four{grid-template-columns:1fr}.head h1{font-size:34px}.hero{padding:23px 20px}.hero h2{font-size:34px}.status{display:none}.topbar .btn{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const state={view:"overview",mobile:false,prospects:[],campaigns:[],activity:[],overview:null,loading:true,error:""};
const navItems=[["overview","Overview"],["prospects","Prospects"],["campaigns","Campaigns"],["approvals","Approvals"],["activity","Activity"],["settings","Settings"]];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const api=async(path,options={})=>{const r=await fetch(path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||"Request failed");return data};
function nav(){return navItems.map(([id,label])=>'<button class="'+(state.view===id?"active":"")+'" onclick="setView(\''+id+'\')">'+label+"</button>").join("")}
function shell(){document.getElementById("app").innerHTML='<div class="app"><aside class="sidebar '+(state.mobile?"open":"")+'"><div class="brand">Kyro</div><div class="workspace"><div class="eyebrow">Workspace</div><div class="name">Owner workspace <span class="dot"></span></div></div><div class="nav">'+nav()+"</div><div class="sidefoot">Private workspace<br>Approval required before outreach.</div></aside><main class="main"><header class="topbar"><div class="topbar-left"><button class="menu" onclick="toggleMenu()" aria-label="Open navigation">☰</button><span class="top-title">Kyro Outreach</span></div><div class="topbar-right"><span class="status">'+(state.error?"Connection issue":"Workspace connected")+'</span><button class="btn" onclick="setView(\'settings\')">Settings</button></div></header><div class="content" id="content"></div></main></div>';renderView()}
function setView(v){state.view=v;state.mobile=false;render()}
function toggleMenu(){state.mobile=!state.mobile;render()}
function metric(label,value,desc){return '<div class="card metric"><span class="eyebrow">'+label+'</span><strong>'+value+'</strong><p>'+desc+"</p></div>"}
function activityRows(items){if(!items.length)return '<div class="empty"><strong>No activity yet.</strong>Workspace events will appear here.</div>';return items.map(x=>'<div class="rule"><div><strong style="font-size:12px">'+esc(x.kind)+'</strong><div class="small muted">'+esc(x.message)+'</div></div><span class="small muted">'+esc(x.created_at)+'</span></div>').join("")}
function head(title,desc,actions=""){return '<div class="head"><div><span class="eyebrow">Kyro Outreach</span><h1>'+title+'</h1><p>'+desc+'</p></div><div class="actions">'+actions+"</div></div>"}
function overview(){const o=state.overview||{metrics:{prospects:state.prospects.length,approved:0,replies:0,activeCampaigns:0},activity:state.activity};const m=o.metrics;return head("Outreach, under control.","Manage prospects, campaigns and approvals from one deliberate workspace. Every action is recorded and nothing is sent implicitly.",'<button class="btn primary" onclick="openProspect()">Add prospect</button><button class="btn" onclick="openCampaign()">New campaign</button>')+'<section class="hero"><div><span class="eyebrow" style="color:#aaa">Approval-first workflow</span><h2>Nothing sends until you approve it.</h2><p>Keep prospect research, campaign planning and approval separate so outreach stays deliberate and traceable.</p><button class="btn" onclick="setView(\'approvals\')">Review approvals</button></div><div class="hero-side"><span>Daily workspace ceiling</span><strong>10</strong><span>successful outreach messages</span></div></section><section class="grid four">'+metric("Prospects",m.prospects,"people in workspace")+metric("Approved",m.approved,"ready for eligible sending")+metric("Replies",m.replies,"replied or interested")+metric("Active campaigns",m.activeCampaigns,"currently active")+'</section><div style="display:flex;align-items:center;gap:10px;margin:24px 0 10px"><span class="eyebrow">Workspace pulse</span><span style="height:1px;background:var(--line);flex:1"></span></div><section class="grid two"><div class="card"><div class="card-head"><h2>Recent activity</h2><button class="btn" onclick="setView(\'activity\')">View all</button></div><div class="card-body">'+activityRows((o.activity||[]).slice(0,5))+'</div></div><div class="card"><div class="card-head"><h2>Workspace rules</h2></div><div class="card-body">'+rule("Approval","Required before scheduling or sending.")+rule("Suppression","Do-not-contact records stop outreach.")+rule("Quota","Successful outreach is capped at 10/day.")+rule("Analytics","Only recorded Kyro events are counted.")+"</div></div></section>"}
function rule(a,b){return '<div class="rule"><strong style="font-size:12px">'+a+'</strong><span class="small muted">'+b+"</span></div>"}
function prospects(){const rows=state.prospects.map(p=>'<tr><td><strong>'+esc(p.name)+'</strong><div class="small muted">'+esc(p.company)+'</div></td><td>'+esc(p.email||"—")+'</td><td><span class="pill '+(p.status==="Approved"?"accent":"")+'">'+esc(p.status)+'</span></td><td>'+esc(p.campaign||"Unassigned")+'</td><td><button class="btn" onclick="openProspect('+p.id+')">Edit</button></td></tr>').join("");return head("Prospects","Build and maintain the people and companies that can enter an outreach campaign.",'<button class="btn primary" onclick="openProspect()">Add prospect</button>')+'<div class="notice">Adding or editing a prospect never grants permission to send. Approval remains a separate action.</div><div class="card"><div class="card-head"><h2>Prospect database</h2><span class="small muted">'+state.prospects.length+" records</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Prospect</th><th>Email</th><th>Status</th><th>Campaign</th><th></th></tr></thead><tbody>"+(rows||'<tr><td colspan="5"><div class="empty"><strong>No prospects yet.</strong>Add your first prospect to begin.</div></td></tr>')+"</tbody></table></div></div>"}
function campaigns(){const cards=state.campaigns.map(c=>'<article class="card"><div class="card-head"><h2>'+esc(c.name)+'</h2><span class="pill '+(c.status==="Active"?"accent":"")+'">'+esc(c.status)+'</span></div><div class="card-body"><span class="eyebrow">Goal</span><p style="margin:6px 0 18px">'+esc(c.goal||"No goal defined.")+'</p><div class="small muted">Channel · '+esc(c.channel||"Email")+'</div><div style="display:flex;gap:7px;margin-top:18px"><button class="btn" onclick="openCampaign('+c.id+')">Edit</button><button class="btn danger" onclick="removeCampaign('+c.id+')">Delete</button></div></div></article>').join("");return head("Campaigns","Turn approved prospects into focused outreach programs with clear goals and controlled activation.",'<button class="btn primary" onclick="openCampaign()">New campaign</button>')+'<div class="grid two">'+(cards||'<div class="card empty"><strong>No campaigns yet.</strong>Create the first campaign when your prospect foundation is ready.</div>')+"</div>"}
function approvals(){const drafts=state.prospects.filter(p=>p.status==="Draft");const cards=drafts.map(p=>'<article class="card"><div class="card-head"><h2>'+esc(p.company)+'</h2><span class="pill">Draft</span></div><div class="card-body"><span class="small muted">Contact</span><p>'+esc(p.name)+' · '+esc(p.email||"No email")+'</p><button class="btn accent" onclick="approve('+p.id+')">Approve</button></div></article>').join("");return head("Approvals","Review records waiting for an explicit decision. Approval does not silently send anything.",'<button class="btn" onclick="setView(\'prospects\')">View prospects</button>')+'<div class="notice">Only records explicitly moved to Approved can enter later scheduling or sending flows.</div><div class="grid two">'+(cards||'<div class="card empty"><strong>Nothing waiting for approval.</strong>Approved records stay out of this queue.</div>')+"</div>"}
function activity(){return head("Activity","A readable audit trail of workspace events.",'<button class="btn" onclick="load()">Refresh</button>')+'<div class="card"><div class="card-body">'+activityRows(state.activity)+"</div></div>"}
function settings(){return head("Settings","Current workspace readiness. Provider credentials and secrets belong on the server, not in browser code.",'<button class="btn" onclick="load()">Refresh</button>')+'<section class="grid two"><div class="card"><div class="card-head"><h2>Delivery</h2></div><div class="card-body"><div class="rule"><strong style="font-size:12px">Sender</strong><span class="small muted">Configured server-side</span></div><div class="rule"><strong style="font-size:12px">Provider</strong><span class="small muted">Server environment</span></div></div></div><div class="card"><div class="card-head"><h2>Safety</h2></div><div class="card-body">'+rule("Approval","Required before scheduling or sending.")+rule("Quota","10 successful outreach messages/day.")+rule("Secrets","Never exposed to the browser.")+rule("Scheduler","Protected server endpoint.")+"</div></div></section>"}
function renderView(){const el=document.getElementById("content");if(!el)return;if(state.loading){el.innerHTML='<div class="loading">Loading workspace…</div>';return}if(state.error){el.innerHTML=head("Workspace unavailable",state.error,'<button class="btn primary" onclick="load()">Retry</button>')+'<div class="card empty"><strong>The interface is intact, but the API did not respond.</strong>Check the deployment root and server function configuration.</div>';return}const map={overview,prospects,campaigns,approvals,activity,settings};el.innerHTML=map[state.view]();window.scrollTo(0,0)}
function render(){shell()}
function toast(message){const n=document.createElement("div");n.className="toast";n.textContent=message;document.body.appendChild(n);setTimeout(()=>n.remove(),2400)}
function modal(title,body,save){const wrap=document.createElement("div");wrap.className="modal-backdrop";wrap.innerHTML='<section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>'+title+'</h2><button class="icon-btn" onclick="this.closest(\'.modal-backdrop\').remove()" aria-label="Close">×</button></div><div class="modal-body">'+body+'</div><div class="modal-foot"><button class="btn" onclick="this.closest(\'.modal-backdrop\').remove()">Cancel</button><button class="btn primary" id="modalSave">Save</button></div></section>';document.body.appendChild(wrap);wrap.querySelector("#modalSave").onclick=save;return wrap}
function openProspect(id){const p=id?state.prospects.find(x=>x.id===id):null;const body='<form class="form" id="prospectForm"><div class="form-grid"><label class="field-group"><span class="eyebrow">Name</span><input class="field" name="name" required value="'+esc(p?.name||"")+'"></label><label class="field-group"><span class="eyebrow">Company</span><input class="field" name="company" required value="'+esc(p?.company||"")+'"></label><label class="field-group"><span class="eyebrow">Email</span><input class="field" name="email" type="email" value="'+esc(p?.email||"")+'"></label><label class="field-group"><span class="eyebrow">Channel</span><select class="field" name="channel"><option '+((p?.channel||"Email")==="Email"?"selected":"")+'>Email</option><option '+((p?.channel||"")==="LinkedIn"?"selected":"")+'>LinkedIn</option></select></label><label class="field-group"><span class="eyebrow">Status</span><select class="field" name="status">'+["New","Draft","Approved","Replied","Interested","Not Interested","Do Not Contact"].map(s=>'<option '+((p?.status||"New")===s?"selected":"")+'>'+s+"</option>").join("")+'</select></label><label class="field-group"><span class="eyebrow">Campaign</span><input class="field" name="campaign" value="'+esc(p?.campaign||"Unassigned")+'"></label><label class="field-group full"><span class="eyebrow">Note</span><textarea class="field" name="note">'+esc(p?.note||"")+"</textarea></label></div></form>";const m=modal(p?"Edit prospect":"Add prospect",body,async()=>{const form=m.querySelector("#prospectForm");if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));try{await api(p?"/api/prospects/"+p.id:"/api/prospects",{method:p?"PATCH":"POST",body:JSON.stringify(data)});m.remove();await load();toast(p?"Prospect updated":"Prospect added")}catch(e){toast(e.message)}})}
function openCampaign(id){const c=id?state.campaigns.find(x=>x.id===id):null;const body='<form class="form" id="campaignForm"><label class="field-group"><span class="eyebrow">Campaign name</span><input class="field" name="name" required value="'+esc(c?.name||"")+'"></label><label class="field-group"><span class="eyebrow">Goal</span><textarea class="field" name="goal">'+esc(c?.goal||"")+'</textarea></label><div class="form-grid"><label class="field-group"><span class="eyebrow">Channel</span><select class="field" name="channel"><option '+((c?.channel||"Email")==="Email"?"selected":"")+'>Email</option><option '+((c?.channel||"")==="LinkedIn"?"selected":"")+'>LinkedIn</option></select></label><label class="field-group"><span class="eyebrow">Status</span><select class="field" name="status">'+["Draft","Active","Paused","Completed"].map(s=>'<option '+((c?.status||"Draft")===s?"selected":"")+'>'+s+"</option>").join("")+'</select></label></div></form>';const m=modal(c?"Edit campaign":"New campaign",body,async()=>{const form=m.querySelector("#campaignForm");if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));try{await api(c?"/api/campaigns/"+c.id:"/api/campaigns",{method:c?"PATCH":"POST",body:JSON.stringify(data)});m.remove();await load();toast(c?"Campaign updated":"Campaign created")}catch(e){toast(e.message)}})}
async function removeCampaign(id){if(!confirm("Delete this campaign?"))return;try{await api("/api/campaigns/"+id,{method:"DELETE"});await load();toast("Campaign deleted")}catch(e){toast(e.message)}}
async function approve(id){try{await api("/api/prospects/"+id,{method:"PATCH",body:JSON.stringify({status:"Approved"})});await load();toast("Prospect approved")}catch(e){toast(e.message)}}
async function load(){state.loading=true;state.error="";render();try{const [o,p,c,a]=await Promise.all([api("/api/overview"),api("/api/prospects"),api("/api/campaigns"),api("/api/activity")]);state.overview=o;state.prospects=p.items||[];state.campaigns=c.items||[];state.activity=a.items||[];state.loading=false;render()}catch(e){state.loading=false;state.error=e.message||"Unable to connect to the Kyro API.";render()}}
load();
</script>
</body>
</html>
